<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Contact — Isaac Zachariah</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
  </head>
  <body>
    <header class="header site-header">
      <div class="container header-inner">
        <a class="brand" href="index.html">Isaac Zachariah</a>
        <button class="nav-toggle" aria-controls="primary-navigation" aria-expanded="false" aria-label="Toggle navigation">
          <span class="hamburger" aria-hidden="true"></span>
        </button>
        <nav id="primary-navigation" class="nav" aria-label="Primary Navigation">
          <div class="nav-links">
            <a href="index.html#about">About</a>
            <a href="index.html#projects">Projects</a>
            <a href="index.html#skills">Skills</a>
            <a href="index.html#contact" aria-current="page">Contact</a>
          </div>
        </nav>
      </div>
    </header>

    <main class="section">
      <div class="container">
        <h1>Contact</h1>
        <p class="muted">I'd love to hear about internship opportunities or projects. Use the form below or reach me via the links in the footer.</p>

        <form id="contact-page-form" class="contact-form" novalidate>
          <div class="form-row">
            <label for="name-page">Full name</label>
            <input id="name-page" name="name" type="text" required>
          </div>

          <div class="form-row">
            <label for="email-page">Email</label>
            <input id="email-page" name="email" type="email" required>
          </div>

          <div class="form-row">
            <label for="message-page">Message</label>
            <textarea id="message-page" name="message" rows="8" required></textarea>
          </div>

          <div class="form-row">
            <button class="btn cta-primary" type="submit">Send message</button>
            <span id="page-form-status" aria-live="polite" class="form-status"></span>
          </div>
        </form>
      </div>
    </main>

    <footer class="footer">
      <div class="container footer-inner">
        <div class="footer-links">
          <a href="assets/cv/Isaac_Zachariah_CV.pdf" download>Download CV</a>
          <a href="#" target="_blank" rel="noopener">GitHub</a>
          <a href="#" target="_blank" rel="noopener">LinkedIn</a>
          <a href="mailto:isaac@example.com">Email</a>
        </div>
        <div class="copyright">© 2026 Isaac Tamunodiepiriye Zachariah</div>
      </div>
    </footer>

    <script src="js/script.js" defer></script>
  </body>
</html>
